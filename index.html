<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Копилка</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* =====================================================================
   1. ЦВЕТА И ТЕМА
   Цвета берутся из темы Telegram (светлая/тёмная). Вне Telegram
   используются запасные значения --fb-*.
   ===================================================================== */
:root{
  --fb-page:#f2f2f7; --fb-card:#ffffff; --fb-text:#111111; --fb-hint:#8e8e93;
  --page: var(--tg-theme-secondary-bg-color, var(--fb-page));
  --card: var(--tg-theme-section-bg-color, var(--tg-theme-bg-color, var(--fb-card)));
  --text: var(--tg-theme-text-color, var(--fb-text));
  --hint: var(--tg-theme-hint-color, var(--fb-hint));
  --accent: var(--tg-theme-button-color, #2481cc);
  --accent-text: var(--tg-theme-button-text-color, #ffffff);
  --danger: var(--tg-theme-destructive-text-color, #e53935);
  --ok:#2fb36a; --warn:#f09a10;
  --line: rgba(127,127,127,.16);
  --soft: rgba(127,127,127,.10);
}
@media (prefers-color-scheme: dark){
  :root{ --fb-page:#000000; --fb-card:#1c1c1e; --fb-text:#f2f2f2; }
}

/* =====================================================================
   2. БАЗОВАЯ РАЗМЕТКА
   ===================================================================== */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{
  background:var(--page); color:var(--text);
  font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  padding:12px 14px calc(90px + env(safe-area-inset-bottom));
}
.wrap{max-width:560px;margin:0 auto}
.view{display:none}
.view.active{display:block;animation:fade .2s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* =====================================================================
   3. КАРТОЧКИ И ТЕКСТ
   ===================================================================== */
.title{font-size:26px;font-weight:800;margin:6px 4px 14px;letter-spacing:-.3px}
.section-h{font-size:12px;color:var(--hint);text-transform:uppercase;letter-spacing:.05em;margin:20px 6px 6px}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px}
.card.click{cursor:pointer}
.card.click:active{opacity:.85}
.muted{color:var(--hint)} .sm{font-size:13px} .center{text-align:center}
p.muted{margin:0 0 12px}
.big-t{font-size:17px;font-weight:700;margin-bottom:6px}
.big-n{font-size:30px;font-weight:800;letter-spacing:-.5px}
.plus{color:var(--ok)} .minus{color:var(--danger)}

/* =====================================================================
   4. ГЛАВНАЯ КАРТОЧКА С ДНЕВНЫМ ЛИМИТОМ (HERO)
   ===================================================================== */
.hero{background:var(--accent);color:var(--accent-text);border-radius:22px;padding:18px 18px 16px;margin-bottom:12px}
.hero.over{background:var(--danger);color:#fff}
.hero.warn{background:var(--warn);color:#fff}
.hero .lbl{opacity:.85;font-size:14px}
.hero .big{font-size:40px;font-weight:800;letter-spacing:-1px;margin:2px 0 4px}
.hero .sub{opacity:.9;font-size:13px}
.hero .track{height:6px;border-radius:3px;background:rgba(255,255,255,.28);margin-top:14px;overflow:hidden}
.hero .track div{height:100%;background:currentColor;border-radius:3px;transition:width .4s}

/* =====================================================================
   5. КНОПКИ, ПОЛЯ ВВОДА, ПЕРЕКЛЮЧАТЕЛИ
   ===================================================================== */
.btn{display:block;width:100%;border:none;border-radius:14px;padding:14px;font:600 16px/1.2 inherit;
     background:var(--accent);color:var(--accent-text);cursor:pointer;margin-bottom:12px}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--card);color:var(--accent)}
.sheet .btn.ghost{background:var(--soft)}
.btn.danger{background:transparent;color:var(--danger);margin:4px 0 0}
.row2{display:flex;gap:8px}
.row2>*{flex:1;min-width:0}
.row2>.btn{margin-bottom:0}
.actions{margin-bottom:12px}

input,select{width:100%;padding:12px;border-radius:12px;border:1px solid transparent;background:var(--soft);
      color:var(--text);font:16px inherit;outline:none;-webkit-appearance:none;appearance:none}
input:focus,select:focus{border-color:var(--accent)}
input::placeholder{color:var(--hint)}
select{background-image:linear-gradient(45deg,transparent 50%,var(--hint) 50%),linear-gradient(135deg,var(--hint) 50%,transparent 50%);
       background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
label.f{display:block;font-size:13px;color:var(--hint);margin:12px 2px 5px}
label.f.first{margin-top:0}
.amount-input{font-size:32px;font-weight:800;text-align:center;padding:14px}
.hint{font-size:13px;color:var(--hint);margin-top:6px}

.switch-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;cursor:pointer}
.switch{position:relative;width:50px;height:30px;flex:none}
.switch input{position:absolute;opacity:0;width:0;height:0}
.switch i{position:absolute;inset:0;border-radius:15px;background:rgba(127,127,127,.3);transition:.2s}
.switch i::before{content:'';position:absolute;width:24px;height:24px;left:3px;top:3px;border-radius:50%;background:#fff;
                  box-shadow:0 1px 3px rgba(0,0,0,.3);transition:.2s}
.switch input:checked + i{background:var(--ok)}
.switch input:checked + i::before{transform:translateX(20px)}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:none;border-radius:20px;padding:8px 12px;background:var(--soft);color:var(--text);font:14px inherit;cursor:pointer}
.chip.on{background:var(--accent);color:var(--accent-text)}
.emo .chip{font-size:20px;padding:6px 9px;line-height:1.2}
.seg{margin-top:14px}

/* =====================================================================
   6. СПИСКИ, ПРОГРЕСС, СТАТИСТИКА
   ===================================================================== */
.stat{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.stat:first-child{border-top:none}
.stat b{font-weight:600;white-space:nowrap}
.stat.total{font-size:17px}
.stat.bad b{color:var(--danger)}
.stat.good b{color:var(--ok)}
.note{font-size:13px;padding:10px 12px;border-radius:12px;background:var(--soft);margin-top:8px}
.note.bad{color:var(--danger)} .note.warn{color:var(--warn)} .note.good{color:var(--ok)}
.empty{color:var(--hint);text-align:center;padding:20px 12px;font-size:14px}

.progress{height:8px;border-radius:4px;background:var(--soft);overflow:hidden;margin:10px 0 6px}
.progress div{height:100%;background:var(--accent);border-radius:4px;transition:width .4s}
.progress.done div{background:var(--ok)}
.progress.thin{height:5px;margin:5px 0 0}

.list .item{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--line);cursor:pointer}
.list .item:first-child,.list .day-h + .item{border-top:none}
.day-h{font-size:12px;color:var(--hint);margin:14px 0 2px;font-weight:600}
.day-h:first-child{margin-top:0}
.ico{flex:none;width:40px;height:40px;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-size:20px;font-weight:700}
.ico.sm{width:34px;height:34px;font-size:17px;border-radius:10px}
.main{flex:1;min-width:0}
.name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.name.b{font-weight:600}
.meta{font-size:12px;color:var(--hint)}
.meta.bad{color:var(--danger)}
.amt{font-weight:600;white-space:nowrap}

.cat-row{display:flex;gap:12px;align-items:center;padding:6px 0}
.cat-top{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.hist-row{display:flex;justify-content:space-between;font-size:14px;padding:7px 0;border-top:1px solid var(--line)}
.wn{padding:12px 0;border-top:1px solid var(--line)}
.wn .name{white-space:normal}
.wn:first-child{border-top:none}

/* =====================================================================
   7. ЦЕЛИ, ДОЛГИ, ВЫПЛАТЫ
   ===================================================================== */
.goal-top{display:flex;align-items:center;gap:12px}
.pct{font-weight:800;color:var(--accent)}
.done .pct{color:var(--ok)}
.goal-bottom{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--hint)}
.goal-bottom .ok{color:var(--ok)}
.goal-bottom .todo{color:var(--accent)}

.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.duo .box{background:var(--card);border-radius:16px;padding:14px;cursor:pointer}
.duo .big-n{font-size:22px}

.frow{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.frow .name{flex:1.4}
.frow .amount{flex:1}
.del{flex:none;width:34px;height:42px;border:none;border-radius:10px;background:transparent;color:var(--danger);font-size:22px;cursor:pointer}
.add{width:100%;padding:11px;border:1px dashed var(--hint);border-radius:12px;background:transparent;color:var(--accent);font:15px inherit;cursor:pointer}

.box-soft{background:var(--soft);border-radius:16px;padding:12px;margin-bottom:6px}
.box-soft .amount-input{background:var(--card);margin:8px 0 10px}
.box-soft .btn.ghost{background:var(--card)}

/* =====================================================================
   8. НИЖНЯЯ ПАНЕЛЬ ВКЛАДОК
   ===================================================================== */
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:var(--card);
      border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:10}
.tab{flex:1;max-width:140px;border:none;background:none;color:var(--hint);font:500 11px inherit;padding:4px 0;cursor:pointer;
     display:flex;flex-direction:column;align-items:center;gap:2px}
.tab .ti{font-size:22px;filter:grayscale(1);opacity:.6;transition:.2s}
.tab.active{color:var(--accent)}
.tab.active .ti{filter:none;opacity:1}

/* =====================================================================
   9. ВСПЛЫВАЮЩАЯ ПАНЕЛЬ (SHEET) И УВЕДОМЛЕНИЯ (TOAST)
   ===================================================================== */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
.overlay.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;max-height:90vh;overflow:auto;background:var(--card);
       border-radius:22px 22px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom));z-index:21;
       transform:translateY(105%);visibility:hidden;transition:transform .25s ease,visibility 0s linear .25s}
.sheet.open{transform:none;visibility:visible;transition:transform .25s ease}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 12px}
.sheet h3{margin:0 0 10px;font-size:20px}
.sheet .btn:last-child{margin-bottom:0}

.toast{position:fixed;left:50%;top:14px;transform:translate(-50%,-30px);opacity:0;background:rgba(30,30,30,.92);color:#fff;
       padding:10px 16px;border-radius:14px;font-size:14px;z-index:30;transition:.25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="wrap">
  <section class="view active" id="v-home"></section>
  <section class="view" id="v-goals"></section>
  <section class="view" id="v-debts"></section>
  <section class="view" id="v-budget"></section>
  <section class="view" id="v-settings"></section>
</div>

<nav class="tabs">
  <button class="tab active" data-tab="home"><span class="ti">🏠</span>Главная</button>
  <button class="tab" data-tab="goals"><span class="ti">🎯</span>Цели</button>
  <button class="tab" data-tab="debts"><span class="ti">🤝</span>Долги</button>
  <button class="tab" data-tab="budget"><span class="ti">📊</span>Бюджет</button>
  <button class="tab" data-tab="settings"><span class="ti">⚙️</span>Настройки</button>
</nav>

<div class="overlay" id="overlay"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<script>
/* =======================================================================
 *  КОПИЛКА — Telegram Mini App для планирования бюджета
 *
 *  Структура кода:
 *    1. Настройки приложения: версия, ссылки, справочники
 *    2. Telegram: инициализация, вибрация, диалоги
 *    3. Утилиты: создание элементов, числа, даты, деньги
 *    4. Состояние и сохранение (Telegram CloudStorage)
 *    5. Миграции данных со старых версий
 *    6. Расчёты: выплаты и периоды, цели, долги, бюджет
 *    7. Общие элементы интерфейса: вкладки, панель, уведомления
 *    8. Вкладка «Главная»: дневной лимит, расходы и доходы
 *    9. Вкладка «Цели»
 *   10. Вкладка «Долги»
 *   11. Вкладка «Бюджет»: выплаты, подработки, платежи, итоги
 *   12. Вкладка «Настройки»: валюта, о приложении, удаление данных
 *   13. Запуск
 * ======================================================================= */


/* =======================================================================
 *  1. НАСТРОЙКИ ПРИЛОЖЕНИЯ
 * ======================================================================= */
const APP_VERSION = '2.0.0';

// Показывается один раз после обновления
const WHATS_NEW = [
  { t: 'Зарплата и аванс',
    d: 'Укажи обе выплаты и их дни во вкладке «Бюджет». Бюджет теперь считается от одной выплаты до следующей, а обязательные платежи и взносы на цели делятся между ними пропорционально суммам.' },
  { t: 'Подработки и разовые доходы',
    d: 'Кнопка «＋\u00a0Доход» на главной. Доход сразу увеличивает лимит на день, а заданный процент можно автоматически направлять в выбранную цель.' },
  { t: 'Долги',
    d: 'Новая вкладка: кто должен тебе и кому должен ты. Возвраты частями, срок с подсветкой просрочки и, по желанию, учёт долга в бюджете периода.' },
  { t: 'Расчёт в процентах',
    d: 'Обязательный платёж можно указать как «10%» от дохода. У целей появился режим «процент от дохода», а в итогах бюджета видна доля каждой статьи.' },
  { t: 'Разбор бюджета',
    d: 'На главной видно, из чего складывается бюджет: выплата, платежи, цели, подработки и долги. Расходы, доходы и долги собраны в одну ленту по дням.' },
  { t: 'Настройки',
    d: 'Отдельная вкладка: выбор одной из 14 валют, версия приложения и удаление данных.' }
];

const CURRENCIES = [
  ['RUB', 'Российский рубль'], ['USD', 'Доллар США'], ['EUR', 'Евро'],
  ['KZT', 'Казахстанский тенге'], ['BYN', 'Белорусский рубль'], ['UAH', 'Украинская гривна'],
  ['UZS', 'Узбекский сум'], ['KGS', 'Киргизский сом'], ['AMD', 'Армянский драм'],
  ['GEL', 'Грузинский лари'], ['AZN', 'Азербайджанский манат'], ['TRY', 'Турецкая лира'],
  ['CNY', 'Китайский юань'], ['GBP', 'Фунт стерлингов']
];

// Категории расходов
const CATS = [
  { id: 'food',      e: '🛒', n: 'Продукты' },
  { id: 'cafe',      e: '🍔', n: 'Кафе и доставка' },
  { id: 'transport', e: '🚕', n: 'Транспорт' },
  { id: 'fun',       e: '🎮', n: 'Развлечения' },
  { id: 'shop',      e: '👕', n: 'Покупки' },
  { id: 'health',    e: '💊', n: 'Здоровье' },
  { id: 'home',      e: '🏠', n: 'Для дома' },
  { id: 'gift',      e: '🎁', n: 'Подарки' },
  { id: 'other',     e: '📦', n: 'Другое' }
];
const catOf = id => CATS.find(c => c.id === id) || CATS[CATS.length - 1];

// Быстрые подписи для доходов
const INCOME_SOURCES = ['Подработка', 'Фриланс', 'Премия', 'Кэшбэк', 'Подарок', 'Продажа вещей'];

const GOAL_EMOJI = ['🎯','🛡️','✈️','🏖️','🚗','🏠','💻','📱','🎓','💍','🎁','🐶','🎮','🏋️','🎸','💰'];

// Шаблоны целей (c — результат calc())
const TEMPLATES = [
  c => ({ emoji: '🛡️', name: 'Подушка безопасности', target: c.monthIncome ? Math.round(c.monthIncome * 2.4 / 1000) * 1000 : '', months: 12 }),
  () => ({ emoji: '✈️', name: 'Отпуск', months: 6 }),
  () => ({ emoji: '💻', name: 'Техника', months: 4 }),
  () => ({ emoji: '🚗', name: 'Машина', months: 24 }),
  () => ({ emoji: '🎁', name: 'Подарки к праздникам', months: 2 })
];


/* =======================================================================
 *  2. TELEGRAM
 * ======================================================================= */
const tg = window.Telegram && window.Telegram.WebApp;
const ver = v => !!(tg && tg.isVersionAtLeast && tg.isVersionAtLeast(v));

if (tg) {
  tg.ready();
  tg.expand();
  try { if (ver('6.1')) { tg.setHeaderColor('secondary_bg_color'); tg.setBackgroundColor('secondary_bg_color'); } } catch (e) {}
  try { if (ver('7.7')) tg.disableVerticalSwipes(); } catch (e) {}
}

// Вибрация (работает только внутри Telegram)
const hap = {
  tap()  { try { ver('6.1') && tg.HapticFeedback.impactOccurred('light'); } catch (e) {} },
  ok()   { try { ver('6.1') && tg.HapticFeedback.notificationOccurred('success'); } catch (e) {} },
  warn() { try { ver('6.1') && tg.HapticFeedback.notificationOccurred('warning'); } catch (e) {} }
};

// Диалог подтверждения: системный в Telegram, обычный в браузере
function ask(msg) {
  msg = msg.length > 250 ? msg.slice(0, 247) + '…' : msg;
  return new Promise(res => {
    try { if (ver('6.2')) { tg.showConfirm(msg, ok => res(!!ok)); return; } } catch (e) {}
    res(window.confirm(msg));
  });
}



/* =======================================================================
 *  3. УТИЛИТЫ
 * ======================================================================= */
const $ = id => document.getElementById(id);

// Создание элемента: h('div', {class: 'card'}, 'текст', другойЭлемент)
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'style') el.style.cssText = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'value') el.value = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }
  return el;
}

// Числа: "12 500,5" → 12500.5; пустое или отрицательное → 0
const num = v => { const x = parseFloat(String(v ?? '').replace(/\s/g, '').replace(',', '.')); return isFinite(x) && x > 0 ? x : 0; };
const isPct = v => /%\s*$/.test(String(v ?? ''));
const pctTxt = x => Math.round(x * 100) + '%';
const clampDay = d => Math.min(31, Math.max(1, parseInt(d) || 1));
const plural = (n, f) => { n = Math.abs(Math.round(n)) % 100; const n1 = n % 10; if (n > 10 && n < 20) return f[2]; if (n1 > 1 && n1 < 5) return f[1]; if (n1 === 1) return f[0]; return f[2]; };

// Деньги в выбранной валюте
let MF;
function setCurrency(code) {
  try { MF = new Intl.NumberFormat('ru-RU', { style: 'currency', currency: code, minimumFractionDigits: 0, maximumFractionDigits: 0 }); }
  catch (e) { MF = new Intl.NumberFormat('ru-RU', { style: 'currency', currency: 'RUB', minimumFractionDigits: 0, maximumFractionDigits: 0 }); }
}
setCurrency('RUB');
const money = n => { const r = Math.round(n); return (r < 0 ? '−' : '') + MF.format(Math.abs(r)); };
const sym = () => (MF.formatToParts(0).find(p => p.type === 'currency') || {}).value || '';

// Даты
const DAY = 864e5;
const sod = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const ym = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
const isoDate = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const validYm = s => /^\d{4}-\d{2}$/.test(s || '');
const fmtD = new Intl.DateTimeFormat('ru-RU', { day: 'numeric', month: 'long' });
const fmtShort = new Intl.DateTimeFormat('ru-RU', { day: 'numeric', month: 'short' });
const fmtMonth = new Intl.DateTimeFormat('ru-RU', { month: 'long', year: 'numeric' });
const days = n => n + ' ' + plural(n, ['день', 'дня', 'дней']);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

function dayLabel(t) {
  const d = sod(new Date(t)).getTime(), today = sod(new Date()).getTime();
  if (d === today) return 'Сегодня';
  if (d === today - DAY) return 'Вчера';
  return fmtD.format(new Date(t));
}

// Значение поля <input type=date> → метка времени (сегодня — текущее время)
function dateToT(value, keepT) {
  if (keepT && isoDate(new Date(keepT)) === value) return keepT;
  if (!value || value === isoDate(new Date())) return Date.now();
  const [y, m, d] = value.split('-').map(Number);
  return new Date(y, m - 1, d, 12).getTime();
}

// День месяца с учётом коротких месяцев (31-е в феврале → 28/29)
function dateAt(y, m, day) {
  const first = new Date(y, m, 1);
  const last = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();
  return new Date(first.getFullYear(), first.getMonth(), Math.min(day, last));
}


/* =======================================================================
 *  4. СОСТОЯНИЕ И СОХРАНЕНИЕ
 *  Внутри Telegram данные хранятся в CloudStorage (облако пользователя),
 *  в браузере — в localStorage.
 * ======================================================================= */
function defaultState() {
  return {
    v: 3,
    currency: 'RUB',
    pay: {
      salary:  { amount: '', day: 25 },
      advance: { on: false, amount: '', day: 10 }
    },
    sidePct: '',          // какой % подработок откладывать
    sideGoal: '',         // в какую цель (id), пусто — в первую активную
    fixed: ['Аренда / ипотека', 'Коммуналка', 'Связь и интернет', 'Кредиты', 'Подписки']
      .map(n => ({ id: uid(), name: n, amount: '' })),
    goals: [],            // { id, emoji, name, target, saved, mode: date|month|pct, deadline, monthly, pct, dep: [{t,a}] }
    tx: [],               // расходы { id, t, a, c, n }
    inc: [],              // разовые доходы { id, t, a, n }
    debts: [],            // { id, dir: lent|owe, who, a, t, due, note, inBudget, pays: [{t,a}] }
    lastCat: 'food',
    seenVersion: APP_VERSION
  };
}
let state = defaultState();

const cloud = ver('6.9') && !!tg.CloudStorage;
const S = {
  get(keys) { return new Promise(res => {
    if (cloud) { tg.CloudStorage.getItems(keys, (e, v) => res(e ? {} : (v || {}))); return; }
    const o = {}; try { keys.forEach(k => o[k] = localStorage.getItem(k)); } catch (e) {} res(o);
  }); },
  set(k, v) { return new Promise(res => {
    if (cloud) { tg.CloudStorage.setItem(k, v, () => res()); return; }
    try { localStorage.setItem(k, v); } catch (e) {} res();
  }); },
  del(keys) { return new Promise(res => {
    if (!keys.length) return res();
    if (cloud) { tg.CloudStorage.removeItems(keys, () => res()); return; }
    try { keys.forEach(k => localStorage.removeItem(k)); } catch (e) {} res();
  }); }
};

// Облако Telegram хранит до 4096 символов на ключ, поэтому данные режутся на куски
const PFX = 'kp2_', CHUNK = 3500;
let chunkCount = 0, saveTimer, saving = Promise.resolve();
let loaded = false;   // пока данные не загружены, ничего не сохраняем — иначе затрём их пустыми

async function loadState() {
  const meta = await S.get([PFX + 'n']);
  const n = parseInt(meta[PFX + 'n']) || 0;
  if (n > 0) {
    const keys = Array.from({ length: n }, (_, i) => PFX + i);
    const vals = await S.get(keys);
    try { const s = normalize(JSON.parse(keys.map(k => vals[k] || '').join(''))); chunkCount = n; return s; } catch (e) {}
  }
  const old = await S.get(['budget_v1']);
  if (old.budget_v1) { try { return normalize(migrateV1(JSON.parse(old.budget_v1))); } catch (e) {} }
  return defaultState();
}

// Удаляем старые записи, чтобы не переполнить облако
function prune() {
  const lim = Date.now() - 400 * DAY;
  state.tx = state.tx.filter(t => t.t >= lim);
  state.inc = state.inc.filter(t => t.t >= lim);
  state.goals.forEach(g => { if (g.dep.length > 80) g.dep = g.dep.slice(-80); });
}

function save() { clearTimeout(saveTimer); saveTimer = setTimeout(flush, 400); }
function flush() {
  clearTimeout(saveTimer);
  if (!loaded) return;
  saving = saving.then(async () => {
    prune();
    // Экранируем не-ASCII, чтобы не разрезать эмодзи пополам на границе куска
    const str = JSON.stringify(state).replace(/[\u007f-￿]/g, c => '\\u' + c.charCodeAt(0).toString(16).padStart(4, '0'));
    const parts = [];
    for (let i = 0; i < str.length; i += CHUNK) parts.push(str.slice(i, i + CHUNK));
    for (let i = 0; i < parts.length; i++) await S.set(PFX + i, parts[i]);
    await S.set(PFX + 'n', String(parts.length));
    if (chunkCount > parts.length) await S.del(Array.from({ length: chunkCount - parts.length }, (_, i) => PFX + (parts.length + i)));
    chunkCount = parts.length;
  }).catch(() => {});
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden) flush(); else if (loaded) renderAll();
});


/* =======================================================================
 *  5. МИГРАЦИИ СО СТАРЫХ ВЕРСИЙ
 * ======================================================================= */
// Версия 1 (один экран с калькулятором) → формат версии 2
function migrateV1(o) {
  const v2 = { salary: o.salary || '', payday: 10, tx: [], goals: [] };
  if (Array.isArray(o.expenses)) v2.fixed = o.expenses.map(e => ({ id: uid(), name: e.name || '', amount: e.amount || '' }));
  if (num(o.goalSum) > 0) {
    const m = Math.max(1, Math.ceil(num(o.goalMonths)) || 12), now = new Date();
    v2.goals.push({ id: uid(), emoji: '🎯', name: o.goalName || 'Цель', target: num(o.goalSum), saved: num(o.goalSaved),
      deadline: ym(new Date(now.getFullYear(), now.getMonth() + m, 1)), monthly: '', dep: [] });
  }
  return v2;
}

// Версия 2 (одна зарплата) → версия 3 (зарплата + аванс, доходы, долги)
function migrateV2(o) {
  const s = defaultState();
  s.pay.salary.amount = String((num(o.salary) + num(o.extra)) || '');
  s.pay.salary.day = clampDay(o.payday || 25);
  if (Array.isArray(o.fixed)) s.fixed = o.fixed;
  if (Array.isArray(o.goals)) s.goals = o.goals;
  if (Array.isArray(o.tx)) s.tx = o.tx;
  s.lastCat = o.lastCat || 'food';
  s.seenVersion = '1.0.0';   // покажем «Что нового»
  return s;
}

// Приводим любые сохранённые данные к актуальному формату
function normalize(o) {
  if (!o || typeof o !== 'object') return defaultState();
  if (!o.v || o.v < 3) o = migrateV2(o);
  const s = defaultState(), d = defaultState().pay;
  Object.assign(s, o);
  s.pay = {
    salary:  { ...d.salary,  ...(o.pay && o.pay.salary) },
    advance: { ...d.advance, ...(o.pay && o.pay.advance) }
  };
  ['fixed', 'goals', 'tx', 'inc', 'debts'].forEach(k => { if (!Array.isArray(s[k])) s[k] = []; });
  s.goals.forEach(g => {
    if (!Array.isArray(g.dep)) g.dep = [];
    if (!g.mode) g.mode = validYm(g.deadline) ? 'date' : (num(g.pct) ? 'pct' : 'month');
  });
  s.debts.forEach(x => { if (!Array.isArray(x.pays)) x.pays = []; });
  return s;
}


/* =======================================================================
 *  6. РАСЧЁТЫ
 * ======================================================================= */

// --- 6.1 Выплаты: зарплата и (по желанию) аванс ---
function payments() {
  const p = state.pay;
  const list = [{ key: 'salary', name: 'Зарплата', gen: 'зарплаты', e: '💰', amount: num(p.salary.amount), day: clampDay(p.salary.day) }];
  if (p.advance.on) list.push({ key: 'advance', name: 'Аванс', gen: 'аванса', e: '💵', amount: num(p.advance.amount), day: clampDay(p.advance.day) });
  return list;
}

// Текущий период: от последней выплаты до следующей
function period(now = new Date()) {
  const cands = [];
  for (const off of [-1, 0, 1, 2]) for (const p of payments()) cands.push({ p, d: dateAt(now.getFullYear(), now.getMonth() + off, p.day) });
  cands.sort((a, b) => a.d - b.d || (a.p.key === 'salary' ? 1 : -1));
  let si = 0;
  cands.forEach((x, i) => { if (x.d <= now) si = i; });
  const start = cands[si];
  const end = cands.slice(si + 1).find(x => x.d > start.d);
  return { start: start.d, end: end.d, s: start.d.getTime(), e: end.d.getTime(), pay: start.p, next: end.p };
}

// Сколько дней «кормит» выплата до следующей
function spanDays(pp) {
  const now = new Date(), start = dateAt(now.getFullYear(), now.getMonth(), pp.day);
  let best = null;
  for (const off of [0, 1, 2]) for (const q of payments()) {
    const d = dateAt(now.getFullYear(), now.getMonth() + off, q.day);
    if (d > start && (!best || d < best)) best = d;
  }
  return Math.max(1, Math.round((best - start) / DAY));
}

// Платёж может быть суммой или процентом: "15000" или "10%"
const fixedValue = (f, monthIncome) => isPct(f.amount) ? monthIncome * num(String(f.amount).replace('%', '')) / 100 : num(f.amount);

// --- 6.2 Цели ---
function goalInfo(g, p, now, monthIncome, share) {
  const target = num(g.target), saved = Math.max(0, +g.saved || 0);
  const depThis = (g.dep || []).filter(d => d.t >= p.s && d.t < p.e).reduce((s, d) => s + d.a, 0);
  const remainStart = Math.max(0, target - Math.max(0, saved - depThis));
  const remain = Math.max(0, target - saved);
  const done = target > 0 && remain <= 0;
  const mode = g.mode || 'date';
  let monthly = 0, overdue = false, eta = null;

  if (mode === 'date') {
    if (validYm(g.deadline)) {
      const [dy, dm] = g.deadline.split('-').map(Number);
      const diff = (dy * 12 + dm - 1) - (now.getFullYear() * 12 + now.getMonth());
      if (diff < 0 && !done) overdue = true;
      else monthly = remainStart / Math.max(1, diff);
    }
  } else {
    const m = mode === 'pct' ? monthIncome * num(g.pct) / 100 : num(g.monthly);
    monthly = Math.min(m, remainStart);
    if (m > 0 && remain > 0) eta = Math.ceil(remain / m);
  }

  const periodPlan = monthly * share;   // доля месячного взноса на эту выплату
  const toDo = done ? 0 : Math.max(0, Math.round(Math.min(periodPlan - Math.max(0, depThis), remain)));
  const pct = target > 0 ? Math.min(100, saved / target * 100) : 0;
  return { g, target, saved, remain, done, mode, monthly, periodPlan, overdue, eta, depThis, toDo, pct, sideExtra: 0 };
}

// --- 6.3 Долги ---
const debtLeft = d => Math.max(0, num(d.a) - (d.pays || []).reduce((s, x) => s + x.a, 0));

// Движение денег по долгу: дал в долг — минус, вернули — плюс (и наоборот)
function debtEvents(d) {
  if (!d.inBudget) return [];
  const sign = d.dir === 'lent' ? -1 : 1;
  return [{ t: d.t, a: sign * num(d.a) }, ...(d.pays || []).map(x => ({ t: x.t, a: -sign * x.a }))];
}

// --- 6.4 Главный расчёт бюджета ---
function calc() {
  const now = new Date(), p = period(now), pays = payments();
  const inP = t => t >= p.s && t < p.e;

  const monthIncome = pays.reduce((s, x) => s + x.amount, 0);
  const share = monthIncome ? p.pay.amount / monthIncome : 1 / pays.length;

  const fixedMonth = state.fixed.reduce((s, f) => s + fixedValue(f, monthIncome), 0);
  const fixedPeriod = fixedMonth * share;

  const goals = state.goals.map(g => goalInfo(g, p, now, monthIncome, share));
  const goalsMonth = goals.reduce((s, x) => s + x.monthly, 0);
  const goalsPeriod = goals.reduce((s, x) => s + x.periodPlan, 0);

  // Подработки: часть идёт в цель, остальное — на жизнь
  const incP = state.inc.filter(x => inP(x.t)).sort((a, b) => b.t - a.t);
  const sideTotal = incP.reduce((s, x) => s + x.a, 0);
  const sideGoal = goals.find(x => x.g.id === state.sideGoal && !x.done && !x.overdue) || goals.find(x => !x.done && !x.overdue);
  let sideSave = sideGoal ? sideTotal * Math.min(100, num(state.sidePct)) / 100 : 0;
  if (sideSave > 0) {
    sideGoal.sideExtra = sideSave;
    sideGoal.toDo = Math.max(0, Math.round(Math.min(sideGoal.remain, sideGoal.periodPlan + sideSave - Math.max(0, sideGoal.depThis))));
  }

  const debtDelta = state.debts.flatMap(debtEvents).filter(e => inP(e.t)).reduce((s, e) => s + e.a, 0);

  const lifeBudget = p.pay.amount - fixedPeriod - goalsPeriod + sideTotal - sideSave + debtDelta;

  const txP = state.tx.filter(t => inP(t.t)).sort((a, b) => b.t - a.t);
  const spent = txP.reduce((s, t) => s + t.a, 0);
  const t0 = sod(now).getTime();
  const spentToday = txP.filter(t => t.t >= t0 && t.t < t0 + DAY).reduce((s, t) => s + t.a, 0);
  const left = lifeBudget - spent;
  const daysLeft = Math.max(1, Math.round((p.e - t0) / DAY));
  const todayLeft = (left + spentToday) / daysLeft - spentToday;
  const tomorrow = daysLeft > 1 ? left / (daysLeft - 1) : left;
  const daysTotal = Math.max(1, Math.round((p.e - p.s) / DAY));

  return { now, p, inP, pays, monthIncome, share, fixedMonth, fixedPeriod, goals, goalsMonth, goalsPeriod,
           incP, sideTotal, sideSave, sideGoal, debtDelta, lifeBudget, txP, spent, spentToday,
           left, daysLeft, todayLeft, tomorrow, daysTotal };
}

/* =======================================================================
 *  8. ВКЛАДКА «ГЛАВНАЯ»
 * ======================================================================= */
function heroCard(c) {
  const nextGen = c.p.next.gen;
  let cls = 'hero', lbl, big, sub;
  if (c.lifeBudget <= 0) {
    cls += ' over'; lbl = 'Бюджет не сходится'; big = money(c.lifeBudget);
    sub = `Платежи и взносы на цели больше, чем приходит до ${nextGen}. Сдвинь сроки целей или пересмотри платежи.`;
  } else if (c.left < 0) {
    cls += ' over'; lbl = `Перерасход до ${nextGen}`; big = money(-c.left);
    sub = `На жизнь было ${money(c.lifeBudget)}, потрачено ${money(c.spent)} · осталось ${days(c.daysLeft)}`;
  } else if (c.todayLeft < 0) {
    cls += ' warn'; lbl = 'Сегодня сверх лимита на'; big = money(-c.todayLeft);
    sub = `С завтра — ${money(c.tomorrow)} в день · до ${nextGen} ${days(c.daysLeft)}`;
  } else {
    lbl = 'Можно потратить сегодня'; big = money(c.todayLeft);
    sub = `До ${nextGen} ${days(c.daysLeft)} · осталось ${money(c.left)}`;
  }
  const pct = c.lifeBudget > 0 ? Math.min(100, c.spent / c.lifeBudget * 100) : 100;
  return h('div', { class: cls },
    h('div', { class: 'lbl' }, lbl), h('div', { class: 'big' }, big), h('div', { class: 'sub' }, sub),
    h('div', { class: 'track' }, h('div', { style: `width:${pct}%` })));
}

// Все движения денег за период: расходы, доходы, долги
function periodOps(c) {
  const ops = [];
  c.txP.forEach(t => {
    const cat = catOf(t.c);
    ops.push({ t: t.t, a: -t.a, e: cat.e, title: t.n || cat.n, sub: t.n ? cat.n : '', open: () => openTx(t) });
  });
  c.incP.forEach(x => ops.push({ t: x.t, a: x.a, e: '💼', title: x.n || 'Доход', sub: 'Доход', open: () => openInc(x) }));
  state.debts.forEach(d => {
    if (!d.inBudget) return;
    const lent = d.dir === 'lent';
    if (c.inP(d.t)) ops.push({ t: d.t, a: lent ? -num(d.a) : num(d.a), e: '🤝', title: d.who, sub: lent ? 'Дал в долг' : 'Взял в долг', open: () => openDebt(d) });
    d.pays.forEach(x => {
      if (c.inP(x.t)) ops.push({ t: x.t, a: lent ? x.a : -x.a, e: '🤝', title: d.who, sub: lent ? 'Вернули долг' : 'Вернул долг', open: () => openDebt(d) });
    });
  });
  return ops.sort((a, b) => b.t - a.t);
}

        h('div', { class: 'main' }, h('div', { class: 'name b' }, 'Долги'),
          h('div', { class: 'meta' }, `Тебе должны ${money(toMe)} · ты должен ${money(mine)}`)),
        h('div', { class: 'muted' }, '›'))));
  }

  // Расходы по категориям
  if (c.spent > 0) {
    const by = {};
    c.txP.forEach(t => by[t.c] = (by[t.c] || 0) + t.a);
    const rows = Object.entries(by).sort((a, b) => b[1] - a[1]), max = rows[0][1];
    K.push(h('div', { class: 'section-h' }, 'Расходы по категориям'));
    K.push(h('div', { class: 'card' }, rows.map(([id, sum]) => {
      const cat = catOf(id);
      return h('div', { class: 'cat-row' }, h('div', { class: 'ico sm' }, cat.e),
        h('div', { class: 'main' },
          h('div', { class: 'cat-top' }, h('span', {}, cat.n), h('b', {}, `${money(sum)} · ${pctTxt(sum / c.spent)}`)),
          h('div', { class: 'progress thin' }, h('div', { style: `width:${sum / max * 100}%` }))));
    })));
  }

  // Лента операций
  const ops = periodOps(c);
  K.push(h('div', { class: 'section-h' }, 'Операции'));
  if (!ops.length) {
    K.push(h('div', { class: 'card empty' }, 'В этом периоде операций пока нет. Записывай траты — и лимит на день будет точным.'));
  } else {
    const card = h('div', { class: 'card list' });
    let last = '';
    for (const o of ops) {
      const lab = dayLabel(o.t);
      if (lab !== last) { card.append(h('div', { class: 'day-h' }, lab)); last = lab; }
      card.append(h('div', { class: 'item', onclick: o.open },
        h('div', { class: 'ico' }, o.e),
        h('div', { class: 'main' }, h('div', { class: 'name' }, o.title), o.sub ? h('div', { class: 'meta' }, o.sub) : null),
        h('div', { class: 'amt ' + (o.a > 0 ? 'plus' : '') }, (o.a > 0 ? '+' : '−') + money(Math.abs(o.a)))));
    }
    K.push(card);
  }

  $('v-home').replaceChildren(...K);
}

/* =======================================================================
 *  9. ВКЛАДКА «ЦЕЛИ»
 * ======================================================================= */
function goalMeta(x) {
  if (x.done) return '🎉 Цель достигнута';
  if (x.overdue) return '⚠️ Срок прошёл — укажи новую дату';
  if (x.mode === 'date' && validYm(x.g.deadline)) {
    const [y, m] = x.g.deadline.split('-').map(Number);
    return `${money(x.monthly)}/мес · срок: ${fmtMonth.format(new Date(y, m - 1, 1))}`;
  }
  if (x.mode === 'pct' && num(x.g.pct) > 0) return `${num(x.g.pct)}% дохода ≈ ${money(x.monthly)}/мес${x.eta ? ` · ещё ~${x.eta} мес.` : ''}`;
  if (x.mode === 'month' && num(x.g.monthly) > 0) return `${money(num(x.g.monthly))}/мес · ещё ~${x.eta} мес.`;
  return 'Без плана — укажи срок, сумму или процент';
}

function renderGoals() {
  const c = calc(), K = [h('div', { class: 'title' }, 'Цели')];

  if (!c.goals.length) {
    K.push(h('div', { class: 'card' },
      h('div', { class: 'big-t' }, '🎯 Поставь первую цель'),
      h('p', { class: 'muted' }, 'Отпуск, подушка безопасности, новый ноутбук — я посчитаю, сколько откладывать с каждой выплаты, и учту это в дневном лимите.'),
      h('div', { class: 'chips' }, TEMPLATES.map(tp => { const p = tp(c); return h('button', { class: 'chip', onclick: () => openGoal(null, p) }, p.emoji + ' ' + p.name); }))));
    K.push(h('button', { class: 'btn', onclick: () => openGoal() }, '＋ Своя цель'));
    $('v-goals').replaceChildren(...K);
    return;
  }

  // Общая сводка
  const totalT = c.goals.reduce((s, x) => s + x.target, 0);
  const totalS = c.goals.reduce((s, x) => s + x.saved, 0);
  const toDo = c.goals.reduce((s, x) => s + x.toDo, 0);
  const planPeriod = c.goalsPeriod + c.sideSave;
  K.push(h('div', { class: 'card' },
    h('div', { class: 'muted sm' }, 'Накоплено на все цели'),
    h('div', { class: 'big-n' }, money(totalS)),
    h('div', { class: 'muted sm' }, 'из ' + money(totalT)),
    h('div', { class: 'progress' }, h('div', { style: `width:${totalT ? Math.min(100, totalS / totalT * 100) : 0}%` })),
    c.goalsMonth > 0 ? stat('В месяц по плану', money(c.goalsMonth) + (c.monthIncome ? ` · ${pctTxt(c.goalsMonth / c.monthIncome)}` : '')) : null,
    planPeriod > 0 ? stat(`С этой выплаты (${c.p.pay.name.toLowerCase()})`, money(planPeriod)) : null,
    c.sideSave > 0 ? h('div', { class: 'note' }, `Включая ${money(c.sideSave)} с подработок → «${c.sideGoal.g.name}»`) : null,
    planPeriod > 0
      ? (toDo > 0
          ? h('button', { class: 'btn', style: 'margin:10px 0 0', onclick: planDeposit }, `Отложил по плану · ${money(toDo)}`)
          : h('div', { class: 'note good' }, '✓ План на этот период выполнен'))
      : null));

  const free = c.monthIncome - c.fixedMonth;
  if (c.monthIncome && c.goalsMonth > free) {
    K.push(h('div', { class: 'note bad', style: 'margin:0 0 12px' },
      `На цели нужно ${money(c.goalsMonth)} в месяц, а после обязательных платежей остаётся ${money(free)}. Сдвинь сроки или уменьши суммы.`));
  }

  // Карточки целей: сначала активные, затем достигнутые
  for (const x of [...c.goals].sort((a, b) => a.done - b.done)) {
    let right = '', rcls = '';
    if (!x.done && x.toDo > 0) { right = `с этой выплаты ещё ${money(x.toDo)}`; rcls = 'todo'; }
    else if (!x.done && x.periodPlan > 0) { right = '✓ за период отложено'; rcls = 'ok'; }
    K.push(h('div', { class: 'card click' + (x.done ? ' done' : ''), onclick: () => openGoal(x.g) },
      h('div', { class: 'goal-top' },
        h('div', { class: 'ico' }, x.g.emoji || '🎯'),
        h('div', { class: 'main' }, h('div', { class: 'name b' }, x.g.name || 'Цель'), h('div', { class: 'meta' }, goalMeta(x))),
        h('div', { class: 'pct' }, Math.floor(x.pct) + '%')),
      h('div', { class: 'progress' + (x.done ? ' done' : '') }, h('div', { style: `width:${x.pct}%` })),
      h('div', { class: 'goal-bottom' }, h('span', {}, `${money(x.saved)} из ${money(x.target)}`), h('span', { class: rcls }, right))));
  }
  K.push(h('button', { class: 'btn ghost', onclick: () => openGoal() }, '＋ Новая цель'));
  $('v-goals').replaceChildren(...K);
}

// «Отложил по плану» — пополнить все цели на сумму этого периода
async function planDeposit() {
  const c = calc(), items = c.goals.filter(x => x.toDo > 0);
  if (!items.length) return;
  const total = items.reduce((s, x) => s + x.toDo, 0);
  const ok = await ask(`Отметить, что ты отложил ${money(total)}?\n\n` + items.map(x => `${x.g.emoji} ${x.g.name}: ${money(x.toDo)}`).join('\n'));
  if (!ok) return;
  const t = Date.now();
  items.forEach(x => { x.g.saved = (+x.g.saved || 0) + x.toDo; x.g.dep.push({ t, a: x.toDo }); });
  refresh(); hap.ok();
  toast('Отлично! План выполнен 💪');
}

function openGoal(g, preset) {
  const now = new Date();
  const d = g ? { ...g } : { emoji: '🎯', name: '', target: '', saved: 0, mode: 'date', deadline: '', monthly: '', pct: '', ...(preset || {}) };
  if (!g && preset && preset.months) d.deadline = ym(new Date(now.getFullYear(), now.getMonth() + preset.months, 1));
  let mode = d.mode || 'date';
  let emoji = d.emoji || '🎯';

  const name = h('input', { placeholder: 'Например, отпуск', maxlength: 40, value: d.name || '' });
  const target = moneyInput(d.target);
  const saved = moneyInput(d.saved);
  const deadline = h('input', { type: 'month', placeholder: 'ГГГГ-ММ', min: ym(now),
    value: validYm(d.deadline) ? d.deadline : ym(new Date(now.getFullYear(), now.getMonth() + 6, 1)) });
  const monthly = moneyInput(d.monthly);
  const pctIn = h('input', { inputmode: 'decimal', placeholder: '10', value: num(d.pct) ? String(num(d.pct)) : '' });
  const boxes = {
    date: field('Накопить к', deadline),
    month: field(`Откладывать в месяц, ${sym()}`, monthly),
    pct: field('Процент от дохода, %', pctIn)
  };
  const preview = h('div', { class: 'note' });

  const emo = h('div', { class: 'chips emo' }, GOAL_EMOJI.map(e =>
    h('button', { class: 'chip' + (e === emoji ? ' on' : ''), onclick: ev => {
      emoji = e;
      emo.querySelectorAll('.chip').forEach(b => b.classList.toggle('on', b === ev.currentTarget));
      hap.tap();
    } }, e)));
  const modeChips = h('div', { class: 'chips seg' },
    h('button', { class: 'chip', 'data-m': 'date', onclick: () => setMode('date') }, '📅 К дате'),
    h('button', { class: 'chip', 'data-m': 'month', onclick: () => setMode('month') }, '💸 Сумма в месяц'),
    h('button', { class: 'chip', 'data-m': 'pct', onclick: () => setMode('pct') }, '％ От дохода'));

  // Живой расчёт плана прямо в форме
  function upd() {
    const t = num(target.value), r = Math.max(0, t - num(saved.value));
    const inc = payments().reduce((s, x) => s + x.amount, 0);
    if (!t) { preview.textContent = 'Укажи сумму цели — и я посчитаю план.'; return; }
    if (r <= 0) { preview.textContent = '🎉 Эта сумма уже накоплена'; return; }
    let per = 0;
    if (mode === 'date') {
      if (!validYm(deadline.value)) { preview.textContent = 'Выбери месяц (формат 2027-06)'; return; }
      const [y, m] = deadline.value.split('-').map(Number);
      const diff = Math.max(1, (y * 12 + m - 1) - (now.getFullYear() * 12 + now.getMonth()));
      per = r / diff;
      preview.textContent = `Нужно откладывать ~${money(per)} в месяц (${diff} ${plural(diff, ['месяц', 'месяца', 'месяцев'])})`;
    } else {
      per = mode === 'pct' ? inc * num(pctIn.value) / 100 : num(monthly.value);
      if (!per) { preview.textContent = mode === 'pct' ? (inc ? 'Укажи процент' : 'Сначала укажи доход во вкладке «Бюджет»') : 'Укажи, сколько готов откладывать в месяц'; return; }
      const m = Math.ceil(r / per);
      preview.textContent = `${mode === 'pct' ? `Это ~${money(per)} в месяц. ` : ''}Накопишь примерно через ${m} ${plural(m, ['месяц', 'месяца', 'месяцев'])}`;
    }
    if (inc && mode !== 'pct') preview.textContent += ` · это ${pctTxt(per / inc)} дохода`;
  }
  function setMode(m) {
    mode = m;
    Object.entries(boxes).forEach(([k, el]) => el.style.display = k === m ? '' : 'none');
    modeChips.querySelectorAll('.chip').forEach(b => b.classList.toggle('on', b.dataset.m === m));
    upd();
  }
  [target, saved, deadline, monthly, pctIn].forEach(i => i.addEventListener('input', upd));

  function saveGoal() {
    const t = num(target.value);
    if (!name.value.trim()) { hap.warn(); name.focus(); return; }
    if (!t) { hap.warn(); target.focus(); return; }
    const o = g || { id: uid(), dep: [] };
    o.emoji = emoji; o.name = name.value.trim(); o.target = t; o.saved = num(saved.value);
    o.mode = mode;
    o.deadline = mode === 'date' && validYm(deadline.value) ? deadline.value : '';
    o.monthly = mode === 'month' ? num(monthly.value) : '';
    o.pct = mode === 'pct' ? num(pctIn.value) : '';
    if (!g) state.goals.push(o);
    refresh(); closeSheet(); hap.ok();
    if (!g) toast(`Цель «${o.name}» создана`);
  }

  // Пополнение и снятие — только для существующей цели
  let depBox = null, hist = null;
  if (g) {
    const depIn = h('input', { class: 'amount-input', inputmode: 'decimal', placeholder: '0 ' + sym() });
    const move = sign => {
      const a = num(depIn.value);
      if (!a) { hap.warn(); depIn.focus(); return; }
      const before = +g.saved || 0, tgt = num(g.target);
      const delta = sign > 0 ? a : -Math.min(a, before);
      if (!delta) { hap.warn(); return; }
      g.saved = before + delta;
      g.dep.push({ t: Date.now(), a: delta });
      refresh(); closeSheet(); hap.ok();
      if (tgt && before < tgt && g.saved >= tgt) toast(`🎉 Цель «${g.name}» достигнута!`);
      else toast(delta > 0 ? 'Пополнено на ' + money(delta) : 'Снято ' + money(-delta));
    };
    depBox = h('div', { class: 'box-soft' },
      h('div', { class: 'muted sm center' }, `Накоплено ${money(+g.saved || 0)} из ${money(num(g.target))}`),
      depIn,
      h('div', { class: 'row2' },
        h('button', { class: 'btn', onclick: () => move(1) }, '＋ Пополнить'),
        h('button', { class: 'btn ghost', onclick: () => move(-1) }, '− Снять')));
    if (g.dep.length) {
      hist = h('div', {},
        h('label', { class: 'f' }, 'История'),
        [...g.dep].reverse().slice(0, 10).map(x => h('div', { class: 'hist-row' },
          h('span', { class: 'muted' }, dayLabel(x.t)),
          h('b', { class: x.a >= 0 ? 'plus' : 'minus' }, (x.a >= 0 ? '+' : '') + money(x.a)))));
    }
  }

  openSheet([
    h('h3', {}, g ? `${g.emoji || '🎯'} ${g.name}` : 'Новая цель'),
    depBox,
    g ? h('label', { class: 'f' }, 'Настройки цели') : null,
    emo,
    field('Название', name),
    h('div', { class: 'row2' }, field(`Сумма цели, ${sym()}`, target), field(`Уже накоплено, ${sym()}`, saved)),
    modeChips, boxes.date, boxes.month, boxes.pct, preview,
    h('button', { class: 'btn', style: 'margin-top:16px', onclick: saveGoal }, g ? 'Сохранить' : 'Создать цель'),
    hist,
    g ? h('button', { class: 'btn danger', onclick: async () => {
      if (await ask(`Удалить цель «${g.name}»? История пополнений тоже удалится.`)) {
        state.goals = state.goals.filter(x => x !== g);
        if (state.sideGoal === g.id) state.sideGoal = '';
        refresh(); closeSheet();
      }
    } }, 'Удалить цель') : null
  ]);
  setMode(mode);
  if (!g && !d.name) setTimeout(() => name.focus(), 300);
}


/* =======================================================================
 *  10. ВКЛАДКА «ДОЛГИ»
 * ======================================================================= */
function debtItem(d) {
  const left = debtLeft(d), total = num(d.a), today = isoDate(new Date());
  const overdue = left > 0 && d.due && d.due < today;
  const meta = [
    d.note,
    left > 0 && left < total ? `вернули ${money(total - left)} из ${money(total)}` : null,
    left > 0 && d.due ? (overdue ? '⚠️ просрочен с ' : 'вернуть до ') + fmtD.format(new Date(d.due + 'T12:00')) : null,
    left <= 0 ? `закрыт · было ${money(total)}` : null
  ].filter(Boolean).join(' · ');
  return h('div', { class: 'item', onclick: () => openDebt(d) },
    h('div', { class: 'ico' }, (d.who || '?').trim().charAt(0).toUpperCase()),
    h('div', { class: 'main' }, h('div', { class: 'name' }, d.who), meta ? h('div', { class: 'meta' + (overdue ? ' bad' : '') }, meta) : null),
    h('div', { class: 'amt ' + (left <= 0 ? 'muted' : d.dir === 'lent' ? 'plus' : 'minus') }, left > 0 ? money(left) : '✓'));
}

function renderDebts() {
  const K = [h('div', { class: 'title' }, 'Долги')];
  const open = state.debts.filter(d => debtLeft(d) > 0);
  const closed = state.debts.filter(d => debtLeft(d) <= 0);
  const toMe = open.filter(d => d.dir === 'lent').reduce((s, d) => s + debtLeft(d), 0);
  const mine = open.filter(d => d.dir === 'owe').reduce((s, d) => s + debtLeft(d), 0);

  K.push(h('div', { class: 'duo' },
    h('div', { class: 'box', onclick: () => openDebt(null, 'lent') },
      h('div', { class: 'muted sm' }, 'Мне должны'), h('div', { class: 'big-n plus' }, money(toMe))),
    h('div', { class: 'box', onclick: () => openDebt(null, 'owe') },
      h('div', { class: 'muted sm' }, 'Я должен'), h('div', { class: 'big-n minus' }, money(mine)))));

  if (toMe || mine) {
    const net = toMe - mine;
    K.push(h('div', { class: 'note ' + (net >= 0 ? 'good' : 'bad'), style: 'margin:0 0 12px' },
      net >= 0 ? `В итоге тебе должны ${money(net)}` : `В итоге ты должен ${money(-net)}`));
  }
  K.push(h('button', { class: 'btn', onclick: () => openDebt() }, '＋ Добавить долг'));

  if (!state.debts.length) {
    K.push(h('div', { class: 'card empty' }, 'Записывай, кто кому сколько должен. Если включить «Учитывать в бюджете», долги будут влиять на дневной лимит.'));
  }
  [['lent', 'Мне должны'], ['owe', 'Я должен']].forEach(([dir, title]) => {
    const list = open.filter(d => d.dir === dir).sort((a, b) => (a.due || '9') .localeCompare(b.due || '9'));
    if (!list.length) return;
    K.push(h('div', { class: 'section-h' }, title));
    K.push(h('div', { class: 'card list' }, list.map(debtItem)));
  });
  if (closed.length) {
    K.push(h('div', { class: 'section-h' }, `Закрытые · ${closed.length}`));
    K.push(h('div', { class: 'card list' }, closed.slice(-20).reverse().map(debtItem)));
  }
  $('v-debts').replaceChildren(...K);
}

function openDebt(d, presetDir) {
  let dir = d ? d.dir : (presetDir || 'lent');
  const who = h('input', { placeholder: 'Имя', maxlength: 40, value: d ? d.who : '' });
  const amount = moneyInput(d ? d.a : '');
  const date = h('input', { type: 'date', max: isoDate(new Date()), value: isoDate(new Date(d ? d.t : Date.now())) });
  const due = h('input', { type: 'date', value: d && d.due ? d.due : '' });
  const note = h('input', { placeholder: 'За что, например «билеты в кино»', maxlength: 60, value: d ? (d.note || '') : '' });
  const inB = h('input', { type: 'checkbox' });
  inB.checked = d ? !!d.inBudget : true;
  const hint = h('div', { class: 'hint' });

  const dirChips = h('div', { class: 'chips' },
    h('button', { class: 'chip', 'data-d': 'lent', onclick: () => setDir('lent') }, '🫴 Мне должны'),
    h('button', { class: 'chip', 'data-d': 'owe', onclick: () => setDir('owe') }, '🙏 Я должен'));
  function setDir(v) {
    dir = v;
    dirChips.querySelectorAll('.chip').forEach(b => b.classList.toggle('on', b.dataset.d === v));
    hint.textContent = v === 'lent'
      ? 'Ты дал деньги — они уйдут из бюджета периода и вернутся, когда долг отдадут.'
      : 'Ты взял деньги — они добавятся к бюджету периода, а при возврате спишутся.';
  }

  function saveDebt() {
    const a = num(amount.value);
    if (!who.value.trim()) { hap.warn(); who.focus(); return; }
    if (!a) { hap.warn(); amount.focus(); return; }
    const o = d || { id: uid(), pays: [] };
    o.dir = dir; o.who = who.value.trim(); o.a = a; o.t = dateToT(date.value, d && d.t);
    o.due = due.value || ''; o.note = note.value.trim(); o.inBudget = inB.checked;
    if (!d) state.debts.push(o);
    refresh(); closeSheet(); hap.ok();
    if (!d) toast('Долг записан');
  }

  // Возврат долга частями или целиком
  let payBox = null, hist = null;
  if (d) {
    const left = debtLeft(d);
    if (left > 0) {
      const payIn = h('input', { class: 'amount-input', inputmode: 'decimal', placeholder: '0 ' + sym() });
      const repay = a => {
        a = Math.min(a, debtLeft(d));
        if (!a) { hap.warn(); payIn.focus(); return; }
        d.pays.push({ t: Date.now(), a });
        refresh(); closeSheet(); hap.ok();
        toast(debtLeft(d) <= 0 ? '✓ Долг закрыт' : `Возврат ${money(a)} записан`);
      };
      payBox = h('div', { class: 'box-soft' },
        h('div', { class: 'muted sm center' }, `Осталось вернуть ${money(left)} из ${money(num(d.a))}`),
        payIn,
        h('div', { class: 'row2' },
          h('button', { class: 'btn', onclick: () => repay(num(payIn.value)) }, d.dir === 'lent' ? 'Вернули часть' : 'Вернул часть'),
          h('button', { class: 'btn ghost', onclick: () => repay(left) }, 'Закрыть весь')));
    }
    if (d.pays.length) {
      hist = h('div', {},
        h('label', { class: 'f' }, 'Возвраты'),
        [...d.pays].reverse().map(x => h('div', { class: 'hist-row' },
          h('span', { class: 'muted' }, dayLabel(x.t)), h('b', { class: 'plus' }, money(x.a)))));
    }
  }

  openSheet([
    h('h3', {}, d ? `🤝 ${d.who}` : 'Новый долг'),
    payBox,
    d ? h('label', { class: 'f' }, 'Данные долга') : null,
    dirChips, hint,
    field('Кто', who),
    h('div', { class: 'row2' }, field(`Сумма, ${sym()}`, amount), field('Когда', date)),
    field('Вернуть до (необязательно)', due),
    field('Комментарий', note),
    switchRow('Учитывать в бюджете', inB),
    h('button', { class: 'btn', style: 'margin-top:18px', onclick: saveDebt }, d ? 'Сохранить' : 'Добавить долг'),
    hist,
    d ? h('button', { class: 'btn danger', onclick: async () => {
      if (await ask(`Удалить долг «${d.who}» вместе с историей возвратов?`)) {
        state.debts = state.debts.filter(x => x !== d); refresh(); closeSheet();
      }
    } }, 'Удалить долг') : null
  ]);
  setDir(dir);
  if (!d) setTimeout(() => who.focus(), 300);
}


/* =======================================================================
 *  11. ВКЛАДКА «БЮДЖЕТ»
 * ======================================================================= */
function dayInput(value, onValid) {
  const i = h('input', { inputmode: 'numeric', placeholder: '1–31', maxlength: 2, value: value || '' });
  i.addEventListener('input', () => { const n = parseInt(i.value); if (n >= 1 && n <= 31) onValid(n); });
  return i;
}

let sideGoalSelect = null;

function renderBudget() {
  const pay = state.pay;

  // --- Выплаты ---
  const salAmt = moneyInput(pay.salary.amount, 'например, 60 000');
  salAmt.addEventListener('input', () => { pay.salary.amount = salAmt.value; refresh(); });
  const salDay = dayInput(pay.salary.day, n => { pay.salary.day = n; refresh(); });

  const advAmt = moneyInput(pay.advance.amount, 'например, 30 000');
  advAmt.addEventListener('input', () => { pay.advance.amount = advAmt.value; refresh(); });
  const advDay = dayInput(pay.advance.day, n => { pay.advance.day = n; refresh(); });
  const advBox = h('div', { class: 'row2' }, field(`Аванс, ${sym()}`, advAmt), field('День аванса', advDay));
  advBox.style.display = pay.advance.on ? '' : 'none';
  const advOn = h('input', { type: 'checkbox' });
  advOn.checked = !!pay.advance.on;
  advOn.addEventListener('change', () => { pay.advance.on = advOn.checked; advBox.style.display = advOn.checked ? '' : 'none'; hap.tap(); refresh(); });

  // --- Подработки ---
  const sidePct = h('input', { inputmode: 'decimal', placeholder: '0', value: num(state.sidePct) ? String(num(state.sidePct)) : '' });
  sidePct.addEventListener('input', () => { state.sidePct = sidePct.value; refresh(); });
  sideGoalSelect = h('select', {});
  sideGoalSelect.addEventListener('change', () => { state.sideGoal = sideGoalSelect.value; refresh(); });

  // --- Обязательные платежи ---
  const list = h('div', {});
  const rows = () => list.replaceChildren(...state.fixed.map(f => {
    const n = h('input', { class: 'name', placeholder: 'Название', maxlength: 40, value: f.name });
    n.addEventListener('input', () => { f.name = n.value; save(); });
    const a = h('input', { class: 'amount', inputmode: 'text', placeholder: 'сумма или %', value: f.amount });
    a.addEventListener('input', () => { f.amount = a.value; refresh(); });
    return h('div', { class: 'frow' }, n, a,
      h('button', { class: 'del', title: 'Удалить', onclick: () => { state.fixed = state.fixed.filter(x => x !== f); hap.tap(); rows(); refresh(); } }, '×'));
  }));
  rows();

  $('v-budget').replaceChildren(
    h('div', { class: 'title' }, 'Бюджет'),

    h('div', { class: 'section-h' }, 'Выплаты'),
    h('div', { class: 'card' },
      h('div', { class: 'row2' }, field(`Зарплата, ${sym()}`, salAmt), field('День зарплаты', salDay)),
      switchRow('Получаю аванс', advOn),
      advBox,
      h('div', { class: 'hint' }, 'Суммы на руки. Бюджет считается от одной выплаты до следующей.')),

    h('div', { class: 'section-h' }, 'Подработки и разовые доходы'),
    h('div', { class: 'card' },
      h('div', { class: 'row2' }, field('Откладывать, %', sidePct), field('В цель', sideGoalSelect)),
      h('div', { class: 'hint' }, 'Доходы добавляются на главной кнопкой «＋\u00a0Доход». Указанный процент сразу планируется в цель.')),

    h('div', { class: 'section-h' }, 'Обязательные платежи'),
    h('div', { class: 'card' },
      h('div', { class: 'hint', style: 'margin:0 0 10px' }, 'То, что платишь каждый месяц в любом случае. Можно указать сумму или процент от дохода, например «10%».'),
      list,
      h('button', { class: 'add', onclick: () => {
        state.fixed.push({ id: uid(), name: '', amount: '' }); rows(); save();
        const last = list.querySelector('.frow:last-child .name'); if (last) last.focus();
      } }, '＋ Добавить платёж'),
      h('div', { class: 'stat total', id: 'fixedTotal', style: 'margin-top:8px' })),

    h('div', { class: 'section-h' }, 'Итог месяца'),
    h('div', { id: 'budgetSummary' }),
    h('div', { id: 'payoutSummary' })
  );
  renderSummary();
}

// Обновляемая часть вкладки: итоги, распределение по выплатам, список целей
function renderSummary() {
  const box = $('budgetSummary');
  if (!box) return;
  const c = calc();

  const ft = $('fixedTotal');
  if (ft) ft.replaceChildren(h('span', {}, 'Итого в месяц'), h('b', {}, money(c.fixedMonth)));

  // Список целей для подработок (не трогаем, пока пользователь выбирает)
  if (sideGoalSelect && document.activeElement !== sideGoalSelect) {
    const active = c.goals.filter(x => !x.done);
    sideGoalSelect.replaceChildren(
      h('option', { value: '' }, active.length ? 'Первая активная' : 'Целей пока нет'),
      ...active.map(x => h('option', { value: x.g.id }, `${x.g.emoji} ${x.g.name}`)));
    sideGoalSelect.value = active.some(x => x.g.id === state.sideGoal) ? state.sideGoal : '';
  }

  if (!c.monthIncome) {
    box.replaceChildren(h('div', { class: 'card empty' }, 'Укажи зарплату — и здесь появится расчёт'));
    $('payoutSummary').replaceChildren();
    return;
  }

  // Месячный итог с долями от дохода
  const lifeMonth = c.monthIncome - c.fixedMonth - c.goalsMonth;
  const pc = v => ` · ${pctTxt(v / c.monthIncome)}`;
  const notes = [];
  const fs = c.fixedMonth / c.monthIncome, gs = c.goalsMonth / c.monthIncome;
  const sal = state.pay.salary, adv = state.pay.advance;
  if (adv.on && clampDay(adv.day) === clampDay(sal.day)) notes.push(['bad', 'Зарплата и аванс в один день — укажи разные дни.']);
  if (lifeMonth <= 0) notes.push(['bad', 'Доход не покрывает обязательные платежи и цели. Сдвинь сроки целей или пересмотри платежи.']);
  else {
    if (fs > 0.5) notes.push(['warn', `Обязательные платежи — ${pctTxt(fs)} дохода. По правилу 50/30/20 комфортно, когда это не больше 50%.`]);
    if (!c.goalsMonth) notes.push(['', `Целей пока нет. Хорошая привычка — откладывать 10–20% дохода: это ${money(c.monthIncome * 0.1)}–${money(c.monthIncome * 0.2)} в месяц.`]);
    else if (gs < 0.1) notes.push(['', `На цели уходит ${pctTxt(gs)} дохода. Если получится — подними до 10–20%.`]);
    else notes.push(['good', `На цели уходит ${pctTxt(gs)} дохода — отличный темп 💪`]);
  }
  box.replaceChildren(h('div', { class: 'card' },
    stat('Доход в месяц', money(c.monthIncome)),
    stat('Обязательные платежи', '−' + money(c.fixedMonth) + pc(c.fixedMonth)),
    stat('Взносы на цели', '−' + money(c.goalsMonth) + pc(c.goalsMonth)),
    stat('На жизнь', money(lifeMonth) + pc(Math.max(0, lifeMonth)), 'total' + (lifeMonth < 0 ? ' bad' : '')),
    notes.map(([k, t]) => h('div', { class: 'note ' + k }, t))));

  // Распределение по выплатам (только если есть аванс)
  if (c.pays.length < 2) { $('payoutSummary').replaceChildren(); return; }
  $('payoutSummary').replaceChildren(
    h('div', { class: 'section-h' }, 'По выплатам'),
    ...[...c.pays].sort((a, b) => a.day - b.day).map(pp => {
      const sh = c.monthIncome ? pp.amount / c.monthIncome : 0.5;
      const life = pp.amount - (c.fixedMonth + c.goalsMonth) * sh;
      const span = spanDays(pp);
      return h('div', { class: 'card' },
        h('div', { class: 'name b', style: 'margin-bottom:4px' }, `${pp.e} ${pp.name} · ${pp.day}-го числа`),
        stat('Приходит', money(pp.amount)),
        stat('На платежи', '−' + money(c.fixedMonth * sh)),
        stat('На цели', '−' + money(c.goalsMonth * sh)),
        stat('На жизнь', money(life), 'total' + (life < 0 ? ' bad' : '')),
        stat(`Это на ${days(span)}`, `≈ ${money(life / span)} в день`));
    }));
}

/* =======================================================================
 *  12. ВКЛАДКА «НАСТРОЙКИ»: валюта, о приложении, удаление данных
 * ======================================================================= */
function renderSettings() {
  const cur = h('select', {}, CURRENCIES.map(([code, title]) => h('option', { value: code }, `${code} — ${title}`)));
  cur.value = state.currency;
  cur.addEventListener('change', () => {
    state.currency = cur.value;
    setCurrency(cur.value);
    save(); renderBudget(); renderAll(); hap.tap();
    toast('Валюта: ' + cur.value);
  });

  $('v-settings').replaceChildren(
    h('div', { class: 'title' }, 'Настройки'),

    h('div', { class: 'section-h' }, 'Валюта'),
    h('div', { class: 'card' },
      cur,
      h('div', { class: 'hint' }, 'Меняется только значок валюты — суммы не пересчитываются.')),

    h('div', { class: 'section-h' }, 'О приложении'),
    h('div', { class: 'card' },
      h('div', { class: 'goal-top' }, h('div', { class: 'ico' }, '🐷'),
        h('div', { class: 'main' }, h('div', { class: 'name b' }, 'Копилка'), h('div', { class: 'meta' }, `Версия ${APP_VERSION}`))),
      h('button', { class: 'btn ghost', style: 'background:var(--soft);margin:12px 0 0', onclick: openWhatsNew }, 'Что нового')),

    h('div', { class: 'section-h' }, 'Данные'),
    h('div', { class: 'card' },
      h('div', { class: 'hint', style: 'margin:0' }, 'Удалит выплаты, платежи, цели, расходы и долги без возможности восстановления.'),
      h('button', { class: 'btn danger', style: 'margin-top:8px', onclick: resetAll }, 'Удалить все данные'))
  );
}

async function resetAll() {
  if (!(await ask('Удалить все данные: выплаты, цели, расходы и долги? Это нельзя отменить.'))) return;
  state = defaultState();
  setCurrency(state.currency);
  flush(); renderBudget(); renderSettings(); renderAll();
  toast('Данные удалены');
}


/* =======================================================================
 *  13. ЗАПУСК
 * ======================================================================= */
loadState().then(s => {
  state = s;
  loaded = true;
  setCurrency(state.currency);
  renderBudget();
  renderSettings();
  renderAll();
  if (state.seenVersion !== APP_VERSION) {
    state.seenVersion = APP_VERSION;
    save();
    setTimeout(openWhatsNew, 400);
  }
});
</script>
